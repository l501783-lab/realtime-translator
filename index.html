<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1976d2"><link rel="manifest" href="manifest.json"><title>即時翻譯</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f5f7fb;color:#172033}
header{padding:18px;background:#fff;position:sticky;top:0;z-index:2;border-bottom:1px solid #e5e7eb}h1{font-size:24px;margin:0 0 10px}
.status{display:flex;justify-content:space-between;color:#5b6472;font-size:14px}main{padding:14px 14px 125px;max-width:760px;margin:auto}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}label{font-size:13px;color:#687180;display:block;margin-bottom:5px}
select{width:100%;padding:12px;border:1px solid #ccd2db;border-radius:12px;background:#fff;font-size:16px}
.listen{width:100%;padding:17px;border:0;border-radius:16px;background:#1976d2;color:#fff;font-size:18px}.listen.on{background:#c62828}
.note{font-size:13px;color:#6b7280;line-height:1.5;margin:8px 2px 14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.src{font-size:19px;line-height:1.5}.dst{font-size:18px;line-height:1.5;margin-top:8px;color:#1457a6;cursor:pointer}.empty{text-align:center;color:#7b8492;padding:40px 10px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px}
.small{flex:1;padding:12px;border:1px solid #ccd2db;border-radius:12px;background:#fff;font-size:15px}
</style></head><body>
<header><h1>即時翻譯</h1><div class="status"><span id="status">準備開始</span><span id="timer">00:00 / 10:00</span></div></header>
<main>
<div class="controls">
<div><label>我說的語言</label><select id="source"><option value="zh-TW">🇹🇼 中文</option><option value="en-US">🇺🇸 English</option><option value="ja-JP">🇯🇵 日本語</option></select></div>
<div><label>翻譯成</label><select id="target"><option value="en">🇺🇸 English</option><option value="zh-TW">🇹🇼 中文</option><option value="ja">🇯🇵 日本語</option></select></div>
</div>
<button id="listen" class="listen">🎙️ 開始說話</button>
<div class="note">支援：中→英、英→中、中→日、日→中。點擊翻譯結果即可朗讀。單次最多 10 分鐘。</div>
<div id="list"><div class="empty">選擇語言後按上面的按鈕開始</div></div></main>
<div class="bar"><button id="pause" class="small">⏸ 暫停</button><button id="stop" class="small">■ 結束</button><button id="clear" class="small">清除</button></div>
<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,listening=false,seconds=0,timerId=null,busy=false;
const $=id=>document.getElementById(id),list=$('list'),statusEl=$('status'),timerEl=$('timer'),btn=$('listen'),source=$('source'),target=$('target');
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startTimer(){if(timerId)return;timerId=setInterval(()=>{seconds++;timerEl.textContent=fmt(seconds)+' / 10:00';if(seconds>=600)stop()},1000)}
function addCard(a,b){if(list.querySelector('.empty'))list.innerHTML='';let c=document.createElement('div');c.className='card';c.innerHTML='<div class="src"></div><div class="dst">🔊 <span></span></div>';c.querySelector('.src').textContent=a;c.querySelector('.dst span').textContent=b;c.querySelector('.dst').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(b);u.lang=target.value==='en'?'en-US':target.value==='ja'?'ja-JP':'zh-TW';speechSynthesis.speak(u)};list.prepend(c)}
async function translate(text){busy=true;statusEl.textContent='翻譯中…';let sl=source.value.startsWith('zh')?'zh-TW':source.value.startsWith('ja')?'ja':'en',tl=target.value;try{let u='https://translate.googleapis.com/translate_a/single?client=gtx&sl='+sl+'&tl='+tl+'&dt=t&q='+encodeURIComponent(text),r=await fetch(u),d=await r.json();return d[0].map(x=>x[0]||'').join('')||'翻譯失敗'}catch(e){return'翻譯失敗，請檢查網路連線'}finally{busy=false;statusEl.textContent=listening?'正在聆聽…':'已暫停'}}
function setup(){if(!SR){statusEl.textContent='此瀏覽器不支援網頁語音辨識';btn.disabled=true;return false}rec=new SR();rec.lang=source.value;rec.continuous=true;rec.interimResults=true;rec.onstart=()=>{listening=true;startTimer();btn.classList.add('on');btn.textContent='🔴 正在聆聽…';statusEl.textContent='正在聆聽…'};rec.onresult=async e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){let t=e.results[i][0].transcript.trim();if(t)addCard(t,await translate(t))}};rec.onerror=()=>statusEl.textContent='語音辨識發生問題，請再試一次';rec.onend=()=>{if(listening&&seconds<600){try{rec.start()}catch(_){}}else{listening=false;btn.classList.remove('on');btn.textContent='🎙️ 開始說話'}};return true}
function stop(){listening=false;if(rec)rec.stop();if(timerId){clearInterval(timerId);timerId=null}statusEl.textContent=seconds>=600?'已達 10 分鐘':'已結束';btn.classList.remove('on');btn.textContent='🎙️ 新對話'}
btn.onclick=()=>{if(seconds>=600)return;if(!rec&&!setup())return;if(listening){rec.stop();return}rec.lang=source.value;try{rec.start()}catch(_){}};
$('pause').onclick=()=>{listening=false;if(rec)rec.stop();if(timerId){clearInterval(timerId);timerId=null}statusEl.textContent='已暫停';btn.classList.remove('on');btn.textContent='🎙️ 繼續說話'};
$('stop').onclick=stop;
$('clear').onclick=()=>{stop();list.innerHTML='<div class="empty">選擇語言後按上面的按鈕開始</div>';seconds=0;timerEl.textContent='00:00 / 10:00';statusEl.textContent='準備開始'};
source.onchange=()=>{if(listening){rec.stop();setTimeout(()=>{if(listening){rec.lang=source.value;try{rec.start()}catch(_){}}},300)}};
</script></body></html>
